<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The One Where We Take Over NYC</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Caveat:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe9;--card:#fffaf6;--ink:#342319;--mut:#7a6a62;--line:#e6d6cc;--moss:#4B542D;--fresh:#AACAA1;--plum:#512E3D;--blush:#E08D9D;--esp:#342319;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1410;--card:#2a1d1b;--ink:#f6efe9;--mut:#b7a59d;--line:#44312f}}
:root[data-theme="dark"]{--bg:#1d1410;--card:#2a1d1b;--ink:#f6efe9;--mut:#b7a59d;--line:#44312f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
.hero{text-align:center;padding:30px 4px 14px}
.hero img{width:100%;max-width:420px;border-radius:22px;border:4px solid var(--blush);display:block;margin:0 auto 6px}
.cap{font-size:12px;color:var(--mut)}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(32px,9vw,54px);margin:10px 0 0;line-height:1.05}
.hero h1 i{color:var(--blush)}
.tag{font-family:Caveat,cursive;font-size:25px;color:var(--plum)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag{color:var(--blush)}}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.cd div{background:var(--plum);color:#fff;border-radius:14px;padding:12px 4px;text-align:center}
.cd b{display:block;font:600 30px 'Playfair Display',serif;color:var(--blush)}
.cd small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px;font-size:13px}
.facts span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px}
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--moss);transition:width .3s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;font:600 13px Poppins;cursor:pointer;text-align:center}
.tabs button small{display:block;font-weight:400;color:var(--mut)}
.tabs button.on{background:var(--plum);border-color:var(--plum);color:#fff}.tabs button.on small{color:var(--blush)}
.day{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.dh{padding:20px;color:#fff}
.dh .n{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.dh h2{font:italic 600 28px 'Playfair Display',serif;margin:2px 0 6px}
.gg{font-family:Caveat,cursive;font-size:22px;margin:0}
.must{display:inline-block;background:var(--blush);color:var(--esp);font:600 11px Poppins;border-radius:99px;padding:2px 10px;margin-left:6px;vertical-align:middle;font-style:normal}
.body{padding:6px 20px 20px}
.st{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:flex-start;cursor:pointer}
.st input{margin-top:5px;width:20px;height:20px;accent-color:var(--moss);flex:0 0 auto}
.st time{flex:0 0 68px;font-weight:600;color:var(--blush);font-size:12.5px;padding-top:2px}
.st b{font-size:15px;display:block}.st p{margin:0;font-size:13.5px;color:var(--mut)}
.st.done b,.st.done p{text-decoration:line-through;opacity:.5}
.out{margin-top:18px;border-radius:16px;border:1px solid var(--line);padding:16px}
.out h3{margin:0 0 2px;font:600 18px 'Playfair Display',serif}
.sw{display:flex;gap:6px;margin:10px 0}.sw i{width:28px;height:28px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.pieces{display:flex;flex-wrap:wrap;gap:6px}.pieces span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12.5px}
.pins{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pins a{background:#E60023;color:#fff;text-decoration:none;font:600 13px Poppins;border-radius:99px;padding:7px 14px}
.pins a.alt{background:var(--moss)}
.vibe{font-size:12px;color:var(--mut)}
footer{text-align:center;font-family:Caveat,cursive;font-size:25px;color:var(--blush);margin-top:26px}
</style></head><body><div class="wrap">
